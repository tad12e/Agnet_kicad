/*
 * KiCad API Protocol Buffer: Base Types
 * Source: https://gitlab.com/kicad/code/kicad/-/blob/master/api/proto/common/types/base_types.proto
 */

syntax = "proto3";

package kiapi.common.types;

import "google/protobuf/field_mask.proto";
import "common/types/enums.proto";

enum CommandStatus
{
  CS_UNKNOWN      = 0;
  CS_OK           = 1;
  CS_FAILED       = 2;
}

message CommandStatusResponse
{
  CommandStatus status = 1;
}

message KiCadVersion
{
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string full_version = 4;
}

enum FrameType
{
  FT_UNKNOWN              = 0;
  FT_PROJECT_MANAGER      = 1;
  FT_SCHEMATIC_EDITOR     = 2;
  FT_PCB_EDITOR           = 3;
  FT_SPICE_SIMULATOR      = 4;
  FT_SYMBOL_EDITOR        = 5;
  FT_FOOTPRINT_EDITOR     = 6;
  FT_DRAWING_SHEET_EDITOR = 7;
}

message KIID
{
  string value = 1;
}

enum DocumentType
{
  DOCTYPE_UNKNOWN       = 0;
  DOCTYPE_SCHEMATIC     = 1;
  DOCTYPE_SYMBOL        = 2;
  DOCTYPE_PCB           = 3;
  DOCTYPE_FOOTPRINT     = 4;
  DOCTYPE_DRAWING_SHEET = 5;
  DOCTYPE_PROJECT       = 6;
}

message LibraryIdentifier
{
  string library_nickname = 1;
  string entry_name = 2;
}

message SheetPath
{
  repeated KIID path = 1;
  string path_human_readable = 2;
}

message ProjectSpecifier
{
  string name = 1;
  string path = 2;
}

message DocumentSpecifier
{
  DocumentType type = 1;

  oneof identifier
  {
    LibraryIdentifier lib_id = 2;
    SheetPath sheet_path = 3;
    string board_filename = 4;
  }

  ProjectSpecifier project = 5;
}

message ItemHeader
{
  DocumentSpecifier document = 1;
  KIID container = 2;
  google.protobuf.FieldMask field_mask = 3;
}

enum ItemRequestStatus
{
  IRS_UNKNOWN            = 0;
  IRS_OK                 = 1;
  IRS_DOCUMENT_NOT_FOUND = 2;
  IRS_FIELD_MASK_INVALID = 3;
}

message Vector2
{
  int64 x_nm = 1;
  int64 y_nm = 2;
}

message Vector3
{
  int64 x_nm = 1;
  int64 y_nm = 2;
  int64 z_nm = 3;
}

message Vector3D
{
  double x_nm = 1;
  double y_nm = 2;
  double z_nm = 3;
}

message Box2
{
  kiapi.common.types.Vector2 position = 1;
  kiapi.common.types.Vector2 size = 2;
}

message Distance
{
  int64 value_nm = 1;
}

message Angle
{
  double value_degrees = 1;
}

message Ratio
{
  double value = 1;
}

message Time
{
  int64 value_as = 1;
}

message Color
{
  double r = 1;
  double g = 2;
  double b = 3;
  double a = 4;
}

message ArcStartMidEnd
{
  Vector2 start = 1;
  Vector2 mid   = 2;
  Vector2 end   = 3;
}

message PolyLineNode
{
  oneof geometry {
    Vector2        point = 1;
    ArcStartMidEnd arc   = 2;
  }
}

message PolyLine
{
  repeated PolyLineNode nodes  = 1;
  bool                  closed = 2;
}

message PolygonWithHoles
{
  PolyLine          outline = 1;
  repeated PolyLine holes   = 2;
}

message PolySet
{
  repeated PolygonWithHoles polygons = 1;
}

enum LockedState
{
  LS_UNKNOWN  = 0;
  LS_UNLOCKED = 1;
  LS_LOCKED   = 2;
}

message TextAttributes
{
  string                      font_name            = 1;
  HorizontalAlignment         horizontal_alignment = 2;
  VerticalAlignment           vertical_alignment   = 3;
  kiapi.common.types.Angle    angle                = 4;
  double                      line_spacing         = 5;
  kiapi.common.types.Distance stroke_width         = 6;
  bool                        italic               = 7;
  bool                        bold                 = 8;
  bool                        underlined           = 9;
  bool                        visible              = 10;
  bool                        mirrored             = 11;
  bool                        multiline            = 12;
  bool                        keep_upright         = 13;
  kiapi.common.types.Vector2  size                 = 14;
  optional kiapi.common.types.Color color          = 15;
}

message Text
{
  kiapi.common.types.Vector2        position   = 2;
  kiapi.common.types.TextAttributes attributes = 3;
  string                            text       = 5;
  string                            hyperlink  = 6;
}

message TextBox
{
  kiapi.common.types.Vector2        top_left     = 2;
  kiapi.common.types.Vector2        bottom_right = 3;
  kiapi.common.types.TextAttributes attributes   = 4;
  string                            text         = 6;
}

message StrokeAttributes
{
  Distance width = 1;
  StrokeLineStyle style = 2;
  Color color = 3;
}

enum GraphicFillType
{
  GFT_UNKNOWN                           = 0;
  GFT_UNFILLED                          = 1;
  GFT_FILLED                            = 2;
  GFT_FILLED_WITH_COLOR                 = 3;
  GFT_FILLED_WITH_BACKGROUND_BODY_COLOR = 4;
  GFT_HATCH                             = 5;
  GFT_REVERSE_HATCH                     = 6;
  GFT_CROSS_HATCH                       = 7;
}

message GraphicFillAttributes
{
  GraphicFillType fill_type = 1;
  Color color = 2;
}

message GraphicAttributes
{
  StrokeAttributes stroke = 1;
  GraphicFillAttributes fill = 2;
}

message GraphicSegmentAttributes
{
  kiapi.common.types.Vector2  start = 1;
  kiapi.common.types.Vector2  end   = 2;
}

message GraphicRectangleAttributes
{
  kiapi.common.types.Vector2  top_left     = 1;
  kiapi.common.types.Vector2  bottom_right = 2;
  kiapi.common.types.Distance corner_radius = 3;
}

message GraphicArcAttributes
{
  kiapi.common.types.Vector2  start = 1;
  kiapi.common.types.Vector2  mid   = 2;
  kiapi.common.types.Vector2  end   = 3;
}

message GraphicCircleAttributes
{
  kiapi.common.types.Vector2  center = 1;
  kiapi.common.types.Vector2  radius_point = 2;
}

message GraphicBezierAttributes
{
  kiapi.common.types.Vector2  start    = 1;
  kiapi.common.types.Vector2  control1 = 2;
  kiapi.common.types.Vector2  control2 = 3;
  kiapi.common.types.Vector2  end      = 4;
}

message GraphicEllipseAttributes
{
  kiapi.common.types.Vector2  center       = 1;
  kiapi.common.types.Distance major_radius = 2;
  kiapi.common.types.Distance minor_radius = 3;
  kiapi.common.types.Angle    rotation     = 4;
}

message GraphicEllipseArcAttributes
{
  kiapi.common.types.Vector2  center       = 1;
  kiapi.common.types.Distance major_radius = 2;
  kiapi.common.types.Distance minor_radius = 3;
  kiapi.common.types.Angle    rotation     = 4;
  kiapi.common.types.Angle    start_angle  = 5;
  kiapi.common.types.Angle    end_angle    = 6;
}

message GraphicShape
{
  GraphicAttributes attributes = 3;

  oneof geometry {
    GraphicSegmentAttributes     segment      = 4;
    GraphicRectangleAttributes   rectangle    = 5;
    GraphicArcAttributes         arc          = 6;
    GraphicCircleAttributes      circle       = 7;
    PolySet                      polygon      = 8;
    GraphicBezierAttributes      bezier       = 9;
    GraphicEllipseAttributes     ellipse      = 10;
    GraphicEllipseArcAttributes  ellipse_arc  = 11;
  }
}

message CompoundShape
{
  repeated GraphicShape shapes = 1;
}

message TitleBlockInfo
{
  string title = 1;
  string date = 2;
  string revision = 3;
  string company = 4;
  string comment1 = 5;
  string comment2 = 6;
  string comment3 = 7;
  string comment4 = 8;
  string comment5 = 9;
  string comment6 = 10;
  string comment7 = 11;
  string comment8 = 12;
  string comment9 = 13;
}

enum AxisAlignment
{
  AA_UNKNOWN = 0;
  AA_X_AXIS = 1;
  AA_Y_AXIS = 2;
}

enum MapMergeMode
{
  MMM_UNKNOWN = 0;
  MMM_MERGE = 1;
  MMM_REPLACE = 2;
}

enum ElectricalPinType
{
  EPT_UNKNOWN = 0;
  EPT_INPUT = 1;
  EPT_OUTPUT = 2;
  EPT_BIDIRECTIONAL = 3;
  EPT_TRISTATE = 4;
  EPT_PASSIVE = 5;
  EPT_FREE = 6;
  EPT_UNSPECIFIED = 7;
  EPT_POWER_INPUT = 8;
  EPT_POWER_OUTPUT = 9;
  EPT_OPEN_COLLECTOR = 10;
  EPT_OPEN_EMITTER = 11;
  EPT_NO_CONNECT = 12;
}

message RuleCheckerMarkerID
{
  string opaque_id = 1;
}

message RuleCheckerMarker
{
  RuleCheckerMarkerID id = 1;
}

enum RuleSeverity
{
  RS_UNKNOWN = 0;
  RS_WARNING = 1;
  RS_ERROR = 2;
  RS_EXCLUSION = 3;
  RS_IGNORE = 4;
  RS_INFO = 5;
  RS_ACTION = 6;
  RS_DEBUG = 7;
  RS_UNDEFINED = 8;
}

message MinOptMax
{
  optional int32 min = 1;
  optional int32 opt = 2;
  optional int32 max = 3;
}

enum PageSize
{
  PS_UNKNOWN = 0;
  PS_A5 = 1;
  PS_A4 = 2;
  PS_A3 = 3;
  PS_A2 = 4;
  PS_A1 = 5;
  PS_A0 = 6;
  PS_ANSI_A = 7;
  PS_ANSI_B = 8;
  PS_ANSI_C = 9;
  PS_ANSI_D = 10;
  PS_ANSI_E = 11;
  PS_GERBER = 12;
  PS_US_LETTER = 13;
  PS_US_LEGAL = 14;
  PS_US_LEDGER = 15;
  PS_USER = 16;
}

enum PageOrientation
{
  PO_UNKNOWN = 0;
  PO_LANDSCAPE = 1;
  PO_PORTRAIT = 2;
}

message PageSettings
{
  PageSize page_size = 1;
  Vector2 user_page_size = 2;
  PageOrientation orientation = 4;
  string drawing_sheet = 5;
}
